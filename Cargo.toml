[package]
authors     = ["ms-jpq <git@bigly.dog>", "JJ <git@toki.la>"]
description = "sod - filter and transform text within files"
edition     = "2021"
name        = "sod"
version     = "0.5.0"


[dependencies]
aho-corasick = { version = "*" }
ansi_term = { version = "*" }
clap = { version = "*", features = ["derive", "wrap_help"] }
difflib = { version = "*" }
futures = { version = "*" }
glob = { version = "*" }
regex = { version = "*" }
shlex = { version = "*" }
tokio = { version = "*", features = [
  "fs",
  "io-std",
  "io-util",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
] }
uuid = { version = "*", features = ["v4"] }
which = { version = "*" }
